# Ambiente di sviluppo FACOLTATIVO (non serve sul server di produzione).
#   docker compose up -d
#   docker compose exec app composer install && docker compose exec app php artisan manutrack:install
# L'app risponde su http://localhost:8080; MariaDB su localhost:3307.
services:
  app:
    build: ./docker
    ports: ['8080:80']
    volumes: ['./:/var/www/html']
    environment:
      DB_HOST: db
      DB_DATABASE: manutrack
      DB_USERNAME: manutrack
      DB_PASSWORD: manutrack
    depends_on: [db]
  cron:
    build: ./docker
    volumes: ['./:/var/www/html']
    environment:
      DB_HOST: db
      DB_DATABASE: manutrack
      DB_USERNAME: manutrack
      DB_PASSWORD: manutrack
    # Come la voce di cron sull'hosting: schedule:run una volta al minuto
    command: sh -c 'while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done'
    depends_on: [db]
  db:
    image: mariadb:10.11
    ports: ['3307:3306']
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: manutrack
      MARIADB_USER: manutrack
      MARIADB_PASSWORD: manutrack
    volumes: ['dbdata:/var/lib/mysql']
volumes:
  dbdata:
