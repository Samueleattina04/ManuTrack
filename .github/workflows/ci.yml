name: CI

on:
  push:
  pull_request:

jobs:
  qualita:
    name: Stile e analisi statica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    name: Test (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MySQL 8.0', image: 'mysql:8.0' }
          - { name: 'MariaDB 10.11', image: 'mariadb:10.11' }
    # Il database parte con docker run (non come "services") per poterlo avviare in memoria
    # (tmpfs) e senza le scritture di sicurezza su disco: sono dati di prova, rifatti a ogni
    # test. Gli stessi test di prima, solo senza attese sul disco (MySQL 8 ne fa molte per
    # ogni CREATE/DROP TABLE).
    steps:
      - uses: actions/checkout@v4
      - name: Avvia ${{ matrix.db.name }} in memoria
        run: |
          FLAGS="--innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --performance-schema=0 --sync-binlog=0"
          case "${{ matrix.db.image }}" in mysql*) FLAGS="$FLAGS --skip-log-bin --innodb-flush-method=nosync" ;; esac
          docker run -d --name db -p 3306:3306 --tmpfs /var/lib/mysql:rw,size=2g \
            -e MYSQL_ROOT_PASSWORD=root -e MARIADB_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=manutrack_test -e MARIADB_DATABASE=manutrack_test \
            -e MYSQL_USER=manutrack -e MARIADB_USER=manutrack \
            -e MYSQL_PASSWORD=manutrack -e MARIADB_PASSWORD=manutrack \
            ${{ matrix.db.image }} $FLAGS
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Attendi il database
        run: |
          # Via TCP: il server temporaneo dell'inizializzazione non ascolta in rete
          for i in $(seq 1 60); do
            if docker exec db sh -c 'mysql -h127.0.0.1 -umanutrack -pmanutrack -e "SELECT 1" manutrack_test || mariadb -h127.0.0.1 -umanutrack -pmanutrack -e "SELECT 1" manutrack_test' >/dev/null 2>&1; then
              docker exec db sh -c 'mysql -h127.0.0.1 -uroot -proot -e "SELECT VERSION()" 2>/dev/null || mariadb -h127.0.0.1 -uroot -proot -e "SELECT VERSION()"'
              exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1
      - run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

  pacchetto:
    name: Pacchetto di rilascio
    runs-on: ubuntu-latest
    needs: [qualita, test]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: scripts/release.sh
      # Pacchetto demo separato (con i dati dimostrativi): mai da consegnare ai clienti
      - run: scripts/release.sh --demo
      - uses: actions/upload-artifact@v4
        with:
          name: manutrack-pacchetto
          path: dist/
          retention-days: 14
