name: CI

on:
  push:
  pull_request:

jobs:
  qualita:
    name: Stile e analisi statica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    name: Test (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MySQL 8.0', image: 'mysql:8.0' }
          - { name: 'MariaDB 10.11', image: 'mariadb:10.11' }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: manutrack_test
          MARIADB_DATABASE: manutrack_test
          MYSQL_USER: manutrack
          MARIADB_USER: manutrack
          MYSQL_PASSWORD: manutrack
          MARIADB_PASSWORD: manutrack
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

  pacchetto:
    name: Pacchetto di rilascio
    runs-on: ubuntu-latest
    needs: [qualita, test]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: scripts/release.sh
      # Pacchetto demo separato (con i dati dimostrativi): mai da consegnare ai clienti
      - run: scripts/release.sh --demo
      - uses: actions/upload-artifact@v4
        with:
          name: manutrack-pacchetto
          path: dist/
          retention-days: 14
